<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PANEN - Navbar</title>
  
  <!-- 1. CDN CSS Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- 2. CDN Bootstrap Icons (untuk ikon keranjang) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- 3. Google Fonts (Plus Jakarta Sans agar mirip desain) -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  
  <!-- 4. File CSS Kustom -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top py-3">
    <div class="container">
      
      <!-- Logo Brand PANEN -->
      <a class="navbar-brand brand-panen" href="#">PANEN</a>
      
      <!-- Tombol Hamburger untuk Tampilan HP -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPanen" aria-controls="navbarPanen" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Menu Navigasi Tengah & Ikon Kanan -->
      <div class="collapse navbar-collapse" id="navbarPanen">
        
        <!-- Daftar Menu di Tengah (mx-auto) -->
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-4">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Beranda</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Harga Hari Ini</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Ekosistem Digital Warung</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Rekomendasi Hasil Tani</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Kisah Sukses Mitra</a>
          </li>
        </ul>

        <!-- Ikon Keranjang & Foto Profil di Kanan -->
        <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
          <a href="#" class="btn-cart" aria-label="Keranjang Belanja">
            <i class="bi bi-cart"></i>
          </a>
          <a href="#" aria-label="Profil Pengguna">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="Profil" class="profile-avatar">
          </a>
        </div>

      </div>
    </div>
  </nav>

  <!-- CDN JavaScript Bootstrap 5.3 (Wajib agar tombol hamburger HP berfungsi) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
